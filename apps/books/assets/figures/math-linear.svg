<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">投影与正交残差</title><desc id="desc">b=(2,0) 投影到 a=(1,1) 方向，投影为 (1,1)，残差为 (1,-1)。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#243b47"/></marker></defs><rect width="900" height="360" fill="#fafbf9"/><g font-family="Arial, 'Microsoft YaHei', sans-serif"><text x="30" y="35" font-size="19" fill="#21645d" text-anchor="start">投影与正交残差</text><line x1="80" y1="270" x2="530" y2="270" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><line x1="160" y1="305" x2="160" y2="55" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><line x1="160" y1="270" x2="336" y2="94" stroke="#adc1bb" stroke-width="2"  stroke-dasharray="5 4"/><line x1="160" y1="270" x2="320" y2="270" stroke="#345d91" stroke-width="2" marker-end="url(#arrow)" /><line x1="160" y1="270" x2="240" y2="190" stroke="#21645d" stroke-width="2" marker-end="url(#arrow)" /><line x1="240" y1="190" x2="320" y2="270" stroke="#a15430" stroke-width="2" marker-end="url(#arrow)" /><text x="330" y="263" font-size="18" fill="#345d91" text-anchor="start">b = (2, 0)</text><text x="215" y="165" font-size="18" fill="#21645d" text-anchor="start">b-hat = (1, 1)</text><text x="330" y="215" font-size="18" fill="#a15430" text-anchor="start">r = (1, -1)</text><text x="520" y="120" font-size="22" fill="#243b47" text-anchor="start">a = (1, 1)</text><text x="520" y="170" font-size="22" fill="#243b47" text-anchor="start">a · r = 0</text><text x="520" y="220" font-size="22" fill="#243b47" text-anchor="start">b = b-hat + r</text><text x="60" y="330" font-size="17" fill="#243b47" text-anchor="start">原点到投影点沿允许方向；投影点到 b 的误差与该方向垂直。</text></g></svg>