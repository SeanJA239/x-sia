<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">调度时间表：响应与周转</title><desc id="desc">同一组任务在 FCFS 与时间片 1 的轮转中具有不同响应和完成时刻。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#243b47"/></marker></defs><rect width="900" height="360" fill="#fafbf9"/><g font-family="Arial, 'Microsoft YaHei', sans-serif"><text x="30" y="35" font-size="19" fill="#21645d" text-anchor="start">调度时间表：响应与周转</text><text x="30" y="92" font-size="19" fill="#243b47" text-anchor="start">FCFS</text><text x="30" y="205" font-size="19" fill="#243b47" text-anchor="start">RR q=1</text><rect x="160" y="60" width="417" height="56" rx="6" fill="#dce8f5" stroke="#adc1bb"/><text x="370" y="94" font-size="18" fill="#243b47" text-anchor="middle">A</text><rect x="580" y="60" width="137" height="56" rx="6" fill="#deeee4" stroke="#adc1bb"/><text x="650" y="94" font-size="18" fill="#243b47" text-anchor="middle">B</text><rect x="720" y="60" width="67" height="56" rx="6" fill="#f4e5d9" stroke="#adc1bb"/><text x="755" y="94" font-size="18" fill="#243b47" text-anchor="middle">C</text><rect x="160" y="170" width="67" height="56" rx="6" fill="#dce8f5" stroke="#adc1bb"/><text x="193" y="204" font-size="18" fill="#243b47" text-anchor="middle">A</text><text x="160" y="252" font-size="14" fill="#243b47" text-anchor="start">0</text><rect x="230" y="170" width="67" height="56" rx="6" fill="#deeee4" stroke="#adc1bb"/><text x="263" y="204" font-size="18" fill="#243b47" text-anchor="middle">B</text><text x="230" y="252" font-size="14" fill="#243b47" text-anchor="start">1</text><rect x="300" y="170" width="67" height="56" rx="6" fill="#f4e5d9" stroke="#adc1bb"/><text x="333" y="204" font-size="18" fill="#243b47" text-anchor="middle">C</text><text x="300" y="252" font-size="14" fill="#243b47" text-anchor="start">2</text><rect x="370" y="170" width="67" height="56" rx="6" fill="#dce8f5" stroke="#adc1bb"/><text x="403" y="204" font-size="18" fill="#243b47" text-anchor="middle">A</text><text x="370" y="252" font-size="14" fill="#243b47" text-anchor="start">3</text><rect x="440" y="170" width="67" height="56" rx="6" fill="#deeee4" stroke="#adc1bb"/><text x="473" y="204" font-size="18" fill="#243b47" text-anchor="middle">B</text><text x="440" y="252" font-size="14" fill="#243b47" text-anchor="start">4</text><rect x="510" y="170" width="67" height="56" rx="6" fill="#dce8f5" stroke="#adc1bb"/><text x="543" y="204" font-size="18" fill="#243b47" text-anchor="middle">A</text><text x="510" y="252" font-size="14" fill="#243b47" text-anchor="start">5</text><rect x="580" y="170" width="67" height="56" rx="6" fill="#dce8f5" stroke="#adc1bb"/><text x="613" y="204" font-size="18" fill="#243b47" text-anchor="middle">A</text><text x="580" y="252" font-size="14" fill="#243b47" text-anchor="start">6</text><rect x="650" y="170" width="67" height="56" rx="6" fill="#dce8f5" stroke="#adc1bb"/><text x="683" y="204" font-size="18" fill="#243b47" text-anchor="middle">A</text><text x="650" y="252" font-size="14" fill="#243b47" text-anchor="start">7</text><rect x="720" y="170" width="67" height="56" rx="6" fill="#dce8f5" stroke="#adc1bb"/><text x="753" y="204" font-size="18" fill="#243b47" text-anchor="middle">A</text><text x="720" y="252" font-size="14" fill="#243b47" text-anchor="start">8</text><text x="790" y="252" font-size="14" fill="#243b47" text-anchor="start">9 ms</text><text x="35" y="300" font-size="17" fill="#243b47" text-anchor="start">A=6、B=2、C=1，同时到达；忽略切换开销。</text><text x="35" y="333" font-size="17" fill="#243b47" text-anchor="start">RR 首次响应为 0、1、2；完成时刻为 A=9、B=5、C=3。</text></g></svg>