<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">操作系统的三条主线</title><desc id="desc">机制提供能力，策略决定何时分给谁；同一抽象可以有不同实现。 进程、容器与虚拟机处在不同隔离层，不应混为一谈。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#243b47"/></marker></defs><rect width="900" height="360" fill="#fafbf9"/><g font-family="Arial, 'Microsoft YaHei', sans-serif"><text x="30" y="35" font-size="19" fill="#21645d" text-anchor="start">操作系统的三条主线</text><rect x="35" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="125" y="131" font-size="18" fill="#243b47" text-anchor="middle">程序请求</text><text x="125" y="156" font-size="14" fill="#243b47" text-anchor="middle">进程 / 地址 / 文件</text><line x1="219" y1="141" x2="246" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="250" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="340" y="131" font-size="18" fill="#243b47" text-anchor="middle">抽象与保护</text><text x="340" y="156" font-size="14" fill="#243b47" text-anchor="middle">受控入口 / 权限</text><line x1="434" y1="141" x2="461" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="465" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="555" y="131" font-size="18" fill="#243b47" text-anchor="middle">资源分配</text><text x="555" y="156" font-size="14" fill="#243b47" text-anchor="middle">策略 / 状态 / 队列</text><line x1="649" y1="141" x2="676" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="680" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="770" y="131" font-size="18" fill="#243b47" text-anchor="middle">硬件执行</text><text x="770" y="156" font-size="14" fill="#243b47" text-anchor="middle">CPU / 内存 / 设备</text><text x="40" y="235" font-size="17" fill="#243b47" text-anchor="start">机制提供能力，策略决定何时分给谁；同一抽象可以有不同实现。</text><text x="40" y="265" font-size="17" fill="#243b47" text-anchor="start">进程、容器与虚拟机处在不同隔离层，不应混为一谈。</text></g></svg>