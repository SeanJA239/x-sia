<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">服务启动与请求验收</title><desc id="desc">停止：停止接收新请求 → 有限时间排空 → 清理 → 退出。 健康端点应反映其检查范围，不用单个 active 标记替代全部证据。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#243b47"/></marker></defs><rect width="900" height="360" fill="#fafbf9"/><g font-family="Arial, 'Microsoft YaHei', sans-serif"><text x="30" y="35" font-size="19" fill="#21645d" text-anchor="start">服务启动与请求验收</text><rect x="35" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="125" y="131" font-size="18" fill="#243b47" text-anchor="middle">启动请求</text><text x="125" y="156" font-size="14" fill="#243b47" text-anchor="middle">管理器接收</text><line x1="219" y1="141" x2="246" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="250" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="340" y="131" font-size="18" fill="#243b47" text-anchor="middle">进程存在</text><text x="340" y="156" font-size="14" fill="#243b47" text-anchor="middle">exec / PID</text><line x1="434" y1="141" x2="461" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="465" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="555" y="131" font-size="18" fill="#243b47" text-anchor="middle">就绪</text><text x="555" y="156" font-size="14" fill="#243b47" text-anchor="middle">依赖与监听完成</text><line x1="649" y1="141" x2="676" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="680" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="770" y="131" font-size="18" fill="#243b47" text-anchor="middle">业务成功</text><text x="770" y="156" font-size="14" fill="#243b47" text-anchor="middle">正确输入与响应</text><text x="40" y="235" font-size="17" fill="#243b47" text-anchor="start">停止：停止接收新请求 → 有限时间排空 → 清理 → 退出。</text><text x="40" y="265" font-size="17" fill="#243b47" text-anchor="start">健康端点应反映其检查范围，不用单个 active 标记替代全部证据。</text></g></svg>