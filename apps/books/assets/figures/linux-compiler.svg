<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">从结构到语义保持</title><desc id="desc">AST 保存结构，不只是原文；优化必须保持语言允许的可观察行为。 重排和删代码需要语义依据，不能只按数学符号或文本替换。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#243b47"/></marker></defs><rect width="900" height="360" fill="#fafbf9"/><g font-family="Arial, 'Microsoft YaHei', sans-serif"><text x="30" y="35" font-size="19" fill="#21645d" text-anchor="start">从结构到语义保持</text><rect x="35" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="125" y="131" font-size="18" fill="#243b47" text-anchor="middle">词法 / 语法</text><text x="125" y="156" font-size="14" fill="#243b47" text-anchor="middle">token → AST</text><line x1="219" y1="141" x2="246" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="250" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="340" y="131" font-size="18" fill="#243b47" text-anchor="middle">语义分析</text><text x="340" y="156" font-size="14" fill="#243b47" text-anchor="middle">作用域 / 类型</text><line x1="434" y1="141" x2="461" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="465" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="555" y="131" font-size="18" fill="#243b47" text-anchor="middle">IR 与优化</text><text x="555" y="156" font-size="14" fill="#243b47" text-anchor="middle">数据流 / 控制流</text><line x1="649" y1="141" x2="676" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="680" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="770" y="131" font-size="18" fill="#243b47" text-anchor="middle">代码生成</text><text x="770" y="156" font-size="14" fill="#243b47" text-anchor="middle">目标机器约束</text><text x="40" y="235" font-size="17" fill="#243b47" text-anchor="start">AST 保存结构，不只是原文；优化必须保持语言允许的可观察行为。</text><text x="40" y="265" font-size="17" fill="#243b47" text-anchor="start">重排和删代码需要语义依据，不能只按数学符号或文本替换。</text></g></svg>