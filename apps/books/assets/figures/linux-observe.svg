<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">单条执行路径上的时间</title><desc id="desc">一条执行路径依次经历排队、计算和等待；并行线程的 CPU 时间可以重叠。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#243b47"/></marker></defs><rect width="900" height="360" fill="#fafbf9"/><g font-family="Arial, 'Microsoft YaHei', sans-serif"><text x="30" y="35" font-size="19" fill="#21645d" text-anchor="start">单条执行路径上的时间</text><text x="40" y="88" font-size="19" fill="#243b47" text-anchor="start">墙钟时间从请求开始计到完成</text><rect x="40" y="120" width="160" height="75" rx="6" fill="#f4e9df" stroke="#adc1bb"/><rect x="200" y="120" width="245" height="75" rx="6" fill="#edf4f1" stroke="#adc1bb"/><rect x="445" y="120" width="245" height="75" rx="6" fill="#e8eef7" stroke="#adc1bb"/><rect x="690" y="120" width="170" height="75" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="70" y="165" font-size="22" fill="#243b47" text-anchor="start">排队</text><text x="265" y="165" font-size="22" fill="#243b47" text-anchor="start">CPU 执行</text><text x="520" y="165" font-size="22" fill="#243b47" text-anchor="start">I/O 等待</text><text x="735" y="165" font-size="22" fill="#243b47" text-anchor="start">CPU</text><line x1="40" y1="215" x2="860" y2="215" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><text x="40" y="265" font-size="18" fill="#243b47" text-anchor="start">这里只是阶段示意，宽度不代表测得的性能。</text><text x="40" y="302" font-size="17" fill="#243b47" text-anchor="start">多线程 CPU 累计时间可超过墙钟时间；低 CPU 也可能有高延迟。</text></g></svg>