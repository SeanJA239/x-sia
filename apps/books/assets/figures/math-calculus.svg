<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">连续稳定不等于离散稳定</title><desc id="desc">Euler 迭代在 ah 为 0.5 时正值衰减，1.5 时交替衰减，2.5 时交替发散。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#243b47"/></marker></defs><rect width="900" height="360" fill="#fafbf9"/><g font-family="Arial, 'Microsoft YaHei', sans-serif"><text x="30" y="35" font-size="19" fill="#21645d" text-anchor="start">连续稳定不等于离散稳定</text><line x1="80" y1="190" x2="775" y2="190" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><line x1="90" y1="305" x2="90" y2="70" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><text x="75" y="306" font-size="14" fill="#243b47" text-anchor="end">-8</text><line x1="95" y1="302" x2="725" y2="302" stroke="#dce5e1" stroke-width="2"  /><text x="75" y="250" font-size="14" fill="#243b47" text-anchor="end">-4</text><line x1="95" y1="246" x2="725" y2="246" stroke="#dce5e1" stroke-width="2"  /><text x="75" y="194" font-size="14" fill="#243b47" text-anchor="end">0</text><line x1="95" y1="190" x2="725" y2="190" stroke="#dce5e1" stroke-width="2"  /><text x="75" y="138" font-size="14" fill="#243b47" text-anchor="end">4</text><line x1="95" y1="134" x2="725" y2="134" stroke="#dce5e1" stroke-width="2"  /><text x="75" y="82" font-size="14" fill="#243b47" text-anchor="end">8</text><line x1="95" y1="78" x2="725" y2="78" stroke="#dce5e1" stroke-width="2"  /><polyline points="95,176 185,183 275,186.5 365,188.25 455,189.125 545,189.5625" fill="none" stroke="#21645d" stroke-width="3" /><circle cx="95" cy="176" r="4" fill="#21645d"/><circle cx="185" cy="183" r="4" fill="#21645d"/><circle cx="275" cy="186.5" r="4" fill="#21645d"/><circle cx="365" cy="188.25" r="4" fill="#21645d"/><circle cx="455" cy="189.125" r="4" fill="#21645d"/><circle cx="545" cy="189.5625" r="4" fill="#21645d"/><polyline p