<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">RAII 与资源所有权</title><desc id="desc">智能指针和标准容器表达所有权；RAII 不自动回滚业务状态。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#243b47"/></marker></defs><rect width="900" height="360" fill="#fafbf9"/><g font-family="Arial, 'Microsoft YaHei', sans-serif"><text x="30" y="35" font-size="19" fill="#21645d" text-anchor="start">RAII 与资源所有权</text><rect x="35" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="125" y="131" font-size="18" fill="#243b47" text-anchor="middle">构造所有者</text><text x="125" y="156" font-size="14" fill="#243b47" text-anchor="middle">建立不变量</text><line x1="219" y1="141" x2="246" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="250" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="340" y="131" font-size="18" fill="#243b47" text-anchor="middle">借用与操作</text><text x="340" y="156" font-size="14" fill="#243b47" text-anchor="middle">所有权不随意复制</text><line x1="434" y1="141" x2="461" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="465" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="555" y="131" font-size="18" fill="#243b47" text-anchor="middle">作用域退出</text><text x="555" y="156" font-size="14" fill="#243b47" text-anchor="middle">正常或异常展开</text><line x1="649" y1="141" x2="676" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="680" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="770" y="131" font-size="18" fill="#243b47" text-anchor="middle">析构释放</text><text x="770" y="156" font-size="14" fill="#243b47" text-anchor="middle">一次且明确</text><text x="40" y="235" font-size="17" fill="#243b47" text-anchor="start">智能指针和标准容器表达所有权；RAII 不自动回滚业务状态。</text></g></svg>