<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">管道连接的是描述符</title><desc id="desc">生产者 stdout 通过管道连消费者 stdin，stderr 单独通向终端。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#243b47"/></marker></defs><rect width="900" height="360" fill="#fafbf9"/><g font-family="Arial, 'Microsoft YaHei', sans-serif"><text x="30" y="35" font-size="19" fill="#21645d" text-anchor="start">管道连接的是描述符</text><rect x="50" y="95" width="210" height="85" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="155" y="126" font-size="18" fill="#243b47" text-anchor="middle">producer</text><text x="155" y="151" font-size="14" fill="#243b47" text-anchor="middle">fd 1: stdout</text><rect x="365" y="95" width="170" height="85" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="450" y="126" font-size="18" fill="#243b47" text-anchor="middle">有界 pipe</text><text x="450" y="151" font-size="14" fill="#243b47" text-anchor="middle">背压 / 字节流</text><rect x="640" y="95" width="210" height="85" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="745" y="126" font-size="18" fill="#243b47" text-anchor="middle">consumer</text><text x="745" y="151" font-size="14" fill="#243b47" text-anchor="middle">fd 0: stdin</text><line x1="260" y1="137" x2="362" y2="137" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><line x1="535" y1="137" x2="637" y2="137" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><line x1="155" y1="180" x2="155" y2="255" stroke="#a15430" stroke-width="2" marker-end="url(#arrow)" /><rect x="50" y="260" width="210" height="60" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="155" y="291" font-size="18" fill="#243b47" text-anchor="middle">终端：stderr</text><text x="195" y="230" font-size="17" fill="#a15430" text-anchor="start">fd 2（默认未进管道）</text><text x="400" y="270" font-size="20" fill="#243b47" text-anchor="start">producer &gt;file 2&gt;&amp;1</text><text x="400" y="305" font-size="17" fill="#243b47" text-anchor="start">按从左到右的顺序改变连接</text></g></svg>