<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">进程与系统调用边界</title><desc id="desc">用户态与内核态之间通过系统调用进入受控接口。 图示是职责关系，不代表每次命令都必须 fork。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#243b47"/></marker></defs><rect width="900" height="360" fill="#fafbf9"/><g font-family="Arial, 'Microsoft YaHei', sans-serif"><text x="30" y="35" font-size="19" fill="#21645d" text-anchor="start">进程与系统调用边界</text><rect x="35" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="125" y="131" font-size="18" fill="#243b47" text-anchor="middle">终端 / PTY</text><text x="125" y="156" font-size="14" fill="#243b47" text-anchor="middle">输入与显示</text><line x1="219" y1="141" x2="246" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="250" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="340" y="131" font-size="18" fill="#243b47" text-anchor="middle">Shell</text><text x="340" y="156" font-size="14" fill="#243b47" text-anchor="middle">解析与安排执行</text><line x1="434" y1="141" x2="461" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="465" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="555" y="131" font-size="18" fill="#243b47" text-anchor="middle">用户进程</text><text x="555" y="156" font-size="14" fill="#243b47" text-anchor="middle">PID / 地址空间</text><line x1="649" y1="141" x2="676" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="680" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="770" y="131" font-size="18" fill="#243b47" text-anchor="middle">Linux 内核</text><text x="770" y="156" font-size="14" fill="#243b47" text-anchor="middle">CPU / 内存 / 设备</text><text x="40" y="235" font-size="17" fill="#243b47" text-anchor="start">用户态与内核态之间通过系统调用进入受控接口。</text><text x="40" y="265" font-size="17" fill="#243b47" text-anchor="start">图示是职责关系，不代表每次命令都必须 fork。</text></g></svg>