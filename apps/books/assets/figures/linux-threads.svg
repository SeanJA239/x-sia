<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">共享状态的读改写</title><desc id="desc">互斥保护整个不变量；只保护最后一次写入不够。 C/C++ 普通对象的数据竞争还可能是未定义行为，不仅是计数少一。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#243b47"/></marker></defs><rect width="900" height="360" fill="#fafbf9"/><g font-family="Arial, 'Microsoft YaHei', sans-serif"><text x="30" y="35" font-size="19" fill="#21645d" text-anchor="start">共享状态的读改写</text><rect x="35" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="125" y="131" font-size="18" fill="#243b47" text-anchor="middle">初值 0</text><text x="125" y="156" font-size="14" fill="#243b47" text-anchor="middle">A 读取 0</text><line x1="219" y1="141" x2="246" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="250" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="340" y="131" font-size="18" fill="#243b47" text-anchor="middle">切换到 B</text><text x="340" y="156" font-size="14" fill="#243b47" text-anchor="middle">B 读取 0</text><line x1="434" y1="141" x2="461" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="465" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="555" y="131" font-size="18" fill="#243b47" text-anchor="middle">两次各自加一</text><text x="555" y="156" font-size="14" fill="#243b47" text-anchor="middle">A 写 1 / B 写 1</text><line x1="649" y1="141" x2="676" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="680" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="770" y="131" font-size="18" fill="#243b47" text-anchor="middle">更新丢失</text><text x="770" y="156" font-size="14" fill="#243b47" text-anchor="middle">需要完整同步协议</text><text x="40" y="235" font-size="17" fill="#243b47" text-anchor="start">互斥保护整个不变量；只保护最后一次写入不够。</text><text x="40" y="265" font-size="17" fill="#243b47" text-anchor="start">C/C++ 普通对象的数据竞争还可能是未定义行为，不仅是计数少一。</text></g></svg>