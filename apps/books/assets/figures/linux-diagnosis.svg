<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">让证据区分候选解释</title><desc id="desc">指标有定义，计数器有生命周期；利用率不等于延迟，进程退出不等于交付。 仅示意诊断顺序，不是机器测量；候选瓶颈可能同时存在。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#243b47"/></marker></defs><rect width="900" height="360" fill="#fafbf9"/><g font-family="Arial, 'Microsoft YaHei', sans-serif"><text x="30" y="35" font-size="19" fill="#21645d" text-anchor="start">让证据区分候选解释</text><rect x="35" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="125" y="131" font-size="18" fill="#243b47" text-anchor="middle">定义症状</text><text x="125" y="156" font-size="14" fill="#243b47" text-anchor="middle">对象 / 输入 / 预期</text><line x1="219" y1="141" x2="246" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="250" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="340" y="131" font-size="18" fill="#243b47" text-anchor="middle">对齐观察范围</text><text x="340" y="156" font-size="14" fill="#243b47" text-anchor="middle">时间窗 / 资源边界</text><line x1="434" y1="141" x2="461" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="465" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="555" y="131" font-size="18" fill="#243b47" text-anchor="middle">区分候选假设</text><text x="555" y="156" font-size="14" fill="#243b47" text-anchor="middle">CPU / 内存 / 等待</text><line x1="649" y1="141" x2="676" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="680" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="770" y="131" font-size="18" fill="#243b47" text-anchor="middle">有边界地验证</text><text x="770" y="156" font-size="14" fill="#243b47" text-anchor="middle">单项变化 / 验收</text><text x="40" y="235" font-size="17" fill="#243b47" text-anchor="start">指标有定义，计数器有生命周期；利用率不等于延迟，进程退出不等于交付。</text><text x="40" y="265" font-size="17" fill="#243b47" text-anchor="start">仅示意诊断顺序，不是机器测量；候选瓶颈可能同时存在。</text></g></svg>