<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">Flash 与 RAM：main 之前的数据准备</title><desc id="desc">启动代码复制 data 初值，清零 bss，建立栈并进入运行库和 main。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#243b47"/></marker></defs><rect width="900" height="360" fill="#fafbf9"/><g font-family="Arial, 'Microsoft YaHei', sans-serif"><text x="30" y="35" font-size="19" fill="#21645d" text-anchor="start">Flash 与 RAM：main 之前的数据准备</text><text x="95" y="80" font-size="22" fill="#243b47" text-anchor="start">Flash</text><text x="575" y="80" font-size="22" fill="#243b47" text-anchor="start">RAM</text><rect x="60" y="100" width="260" height="64" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="190" y="131" font-size="18" fill="#243b47" text-anchor="middle">向量表 / text / rodata</text><rect x="60" y="180" width="260" height="64" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="190" y="211" font-size="18" fill="#243b47" text-anchor="middle">data 初值（LMA）</text><rect x="540" y="100" width="290" height="64" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="685" y="131" font-size="18" fill="#243b47" text-anchor="middle">data（VMA）</text><rect x="540" y="180" width="290" height="64" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="685" y="211" font-size="18" fill="#243b47" text-anchor="middle">bss：启动时清零</text><rect x="540" y="260" width="290" height="64" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="685" y="291" font-size="18" fill="#243b47" text-anchor="middle">stack / heap / buffers</text><line x1="320" y1="211" x2="536" y2="132" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><text x="355" y="142" font-size="18" fill="#243b47" text-anchor="start">复制</text><text x="50" y="290" font-size="20" fill="#243b47" text-anchor="start">向量 → Reset_Handler</text><text x="50" y="325" font-size="20" fill="#243b47" text-anchor="start">初始化 → 运行库 → main</text></g></svg>