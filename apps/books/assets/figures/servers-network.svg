<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">逐层建立可达性与信任</title><desc id="desc">DNS 成功 ≠ 端口可达；连接成功 ≠ 身份正确；HTTP 200 ≠ 业务正确。 TLS 与 SSH 是不同协议，这里表示传输之上的安全层选择。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#243b47"/></marker></defs><rect width="900" height="360" fill="#fafbf9"/><g font-family="Arial, 'Microsoft YaHei', sans-serif"><text x="30" y="35" font-size="19" fill="#21645d" text-anchor="start">逐层建立可达性与信任</text><rect x="35" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="125" y="131" font-size="18" fill="#243b47" text-anchor="middle">DNS / 路由</text><text x="125" y="156" font-size="14" fill="#243b47" text-anchor="middle">名字 → 地址 → 下一跳</text><line x1="219" y1="141" x2="246" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="250" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="340" y="131" font-size="18" fill="#243b47" text-anchor="middle">TCP</text><text x="340" y="156" font-size="14" fill="#243b47" text-anchor="middle">监听 / 连接</text><line x1="434" y1="141" x2="461" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="465" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="555" y="131" font-size="18" fill="#243b47" text-anchor="middle">TLS 或 SSH</text><text x="555" y="156" font-size="14" fill="#243b47" text-anchor="middle">加密与身份</text><line x1="649" y1="141" x2="676" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="680" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="770" y="131" font-size="18" fill="#243b47" text-anchor="middle">应用协议</text><text x="770" y="156" font-size="14" fill="#243b47" text-anchor="middle">请求 / 响应 / 语义</text><text x="40" y="235" font-size="17" fill="#243b47" text-anchor="start">DNS 成功 ≠ 端口可达；连接成功 ≠ 身份正确；HTTP 200 ≠ 业务正确。</text><text x="40" y="265" font-size="17" fill="#243b47" text-anchor="start">TLS 与 SSH 是不同协议，这里表示传输之上的安全层选择。</text></g></svg>