<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">软件流水线与有界数据流</title><desc id="desc">队列满时必须阻塞、拒绝或按明确策略处理，不能无限积压。 关闭和错误还需控制通道；队列暂时空不等于所有任务完成。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#243b47"/></marker></defs><rect width="900" height="360" fill="#fafbf9"/><g font-family="Arial, 'Microsoft YaHei', sans-serif"><text x="30" y="35" font-size="19" fill="#21645d" text-anchor="start">软件流水线与有界数据流</text><rect x="35" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="125" y="131" font-size="18" fill="#243b47" text-anchor="middle">读取</text><text x="125" y="156" font-size="14" fill="#243b47" text-anchor="middle">输入契约</text><line x1="219" y1="141" x2="246" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="250" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="340" y="131" font-size="18" fill="#243b47" text-anchor="middle">有界队列</text><text x="340" y="156" font-size="14" fill="#243b47" text-anchor="middle">容量 / 背压</text><line x1="434" y1="141" x2="461" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="465" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="555" y="131" font-size="18" fill="#243b47" text-anchor="middle">并发计算</text><text x="555" y="156" font-size="14" fill="#243b47" text-anchor="middle">所有权 / 结果 ID</text><line x1="649" y1="141" x2="676" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="680" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="770" y="131" font-size="18" fill="#243b47" text-anchor="middle">写出与验收</text><text x="770" y="156" font-size="14" fill="#243b47" text-anchor="middle">顺序 / 副作用</text><text x="40" y="235" font-size="17" fill="#243b47" text-anchor="start">队列满时必须阻塞、拒绝或按明确策略处理，不能无限积压。</text><text x="40" y="265" font-size="17" fill="#243b47" text-anchor="start">关闭和错误还需控制通道；队列暂时空不等于所有任务完成。</text></g></svg>