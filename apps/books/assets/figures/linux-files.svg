<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">名字、对象与打开状态</title><desc id="desc">两个硬链接共享 inode；文件描述符经过打开文件描述引用文件；软链接保存路径。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#243b47"/></marker></defs><rect width="900" height="360" fill="#fafbf9"/><g font-family="Arial, 'Microsoft YaHei', sans-serif"><text x="30" y="35" font-size="19" fill="#21645d" text-anchor="start">名字、对象与打开状态</text><rect x="35" y="80" width="190" height="75" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="130" y="111" font-size="18" fill="#243b47" text-anchor="middle">目录项 A</text><text x="130" y="136" font-size="14" fill="#243b47" text-anchor="middle">original.txt</text><rect x="35" y="205" width="190" height="75" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="130" y="236" font-size="18" fill="#243b47" text-anchor="middle">目录项 B</text><text x="130" y="261" font-size="14" fill="#243b47" text-anchor="middle">hard.txt</text><rect x="335" y="145" width="190" height="75" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="430" y="176" font-size="18" fill="#243b47" text-anchor="middle">同一 inode</text><text x="430" y="201" font-size="14" fill="#243b47" text-anchor="middle">类型 / 权限 / 数据</text><line x1="225" y1="117" x2="333" y2="171" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><line x1="225" y1="242" x2="333" y2="193" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="630" y="70" width="225" height="75" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="742.5" y="101" font-size="18" fill="#243b47" text-anchor="middle">进程文件描述符</text><text x="742.5" y="126" font-size="14" fill="#243b47" text-anchor="middle">fd → 打开文件描述</text><line x1="630" y1="118" x2="527" y2="168" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="620" y="230" width="235" height="75" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="737.5" y="261" font-size="18" fill="#243b47" text-anchor="middle">独立符号链接 inode</text><text x="737.5" y="286" font-size="14" fill="#243b47" text-anchor="middle">内容为目标路径字符串</text><text x="30" y="330" font-size="16" fill="#243b47" text-anchor="start">同一文件系统中，硬链接共享对象；独立 open 通常有独立偏移。</text></g></svg>