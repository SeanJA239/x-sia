<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">请求、等待与重新运行</title><desc id="desc">唤醒通常只让任务成为可运行；不等于马上开始执行。 图示为阻塞路径；缓存命中与其他对象可以走不同路径。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#243b47"/></marker></defs><rect width="900" height="360" fill="#fafbf9"/><g font-family="Arial, 'Microsoft YaHei', sans-serif"><text x="30" y="35" font-size="19" fill="#21645d" text-anchor="start">请求、等待与重新运行</text><rect x="35" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="125" y="131" font-size="18" fill="#243b47" text-anchor="middle">进入内核</text><text x="125" y="156" font-size="14" fill="#243b47" text-anchor="middle">参数 / 对象 / 权限</text><line x1="219" y1="141" x2="246" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="250" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="340" y="131" font-size="18" fill="#243b47" text-anchor="middle">数据尚不可用</text><text x="340" y="156" font-size="14" fill="#243b47" text-anchor="middle">正确登记等待</text><line x1="434" y1="141" x2="461" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="465" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="555" y="131" font-size="18" fill="#243b47" text-anchor="middle">完成事件</text><text x="555" y="156" font-size="14" fill="#243b47" text-anchor="middle">改变条件 / 唤醒</text><line x1="649" y1="141" x2="676" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="680" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="770" y="131" font-size="18" fill="#243b47" text-anchor="middle">再次获得 CPU</text><text x="770" y="156" font-size="14" fill="#243b47" text-anchor="middle">检查状态 / 返回</text><text x="40" y="235" font-size="17" fill="#243b47" text-anchor="start">唤醒通常只让任务成为可运行；不等于马上开始执行。</text><text x="40" y="265" font-size="17" fill="#243b47" text-anchor="start">图示为阻塞路径；缓存命中与其他对象可以走不同路径。</text></g></svg>