<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">地址翻译与缓存定位</title><desc id="desc">虚拟地址页号通过 TLB 或页表映射，页内偏移保持；物理缓存地址再拆分标签、索引和行内偏移。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#243b47"/></marker></defs><rect width="900" height="360" fill="#fafbf9"/><g font-family="Arial, 'Microsoft YaHei', sans-serif"><text x="30" y="35" font-size="19" fill="#21645d" text-anchor="start">地址翻译与缓存定位</text><rect x="40" y="80" width="210" height="72" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="145" y="111" font-size="18" fill="#243b47" text-anchor="middle">VPN</text><text x="145" y="136" font-size="14" fill="#243b47" text-anchor="middle">虚拟页号</text><rect x="250" y="80" width="180" height="72" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="340" y="111" font-size="18" fill="#243b47" text-anchor="middle">offset</text><text x="340" y="136" font-size="14" fill="#243b47" text-anchor="middle">页内偏移</text><line x1="145" y1="152" x2="145" y2="185" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="40" y="190" width="210" height="70" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="145" y="221" font-size="18" fill="#243b47" text-anchor="middle">TLB / 页表</text><text x="145" y="246" font-size="14" fill="#243b47" text-anchor="middle">VPN → PFN</text><line x1="250" y1="225" x2="505" y2="225" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="510" y="190" width="180" height="70" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="600" y="221" font-size="18" fill="#243b47" text-anchor="middle">PFN</text><text x="600" y="246" font-size="14" fill="#243b47" text-anchor="middle">物理页框</text><rect x="690" y="190" width="170" height="70" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="775" y="221" font-size="18" fill="#243b47" text-anchor="middle">offset</text><text x="775" y="246" font-size="14" fill="#243b47" text-anchor="middle">保持不变</text><line x1="430" y1="115" x2="770" y2="115" stroke="#243b47" stroke-width="2"  /><line x1="770" y1="115" x2="770" y2="185" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><text x="35" y="305" font-size="21" fill="#243b47" text-anchor="start">物理地址 → [ tag | set index | block offset ] → 缓存行</text><text x="35" y="337" font-size="16" fill="#243b47" text-anchor="start">简化物理索引缓存模型；TLB miss 不等于需要磁盘 I/O。</text></g></svg>