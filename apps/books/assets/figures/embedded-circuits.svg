<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">从逻辑电平回到电路</title><desc id="desc">LED 串联电阻接地；开漏总线上拉到电源且带等效电容，释放后按 RC 规律上升。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#243b47"/></marker></defs><rect width="900" height="360" fill="#fafbf9"/><g font-family="Arial, 'Microsoft YaHei', sans-serif"><text x="30" y="35" font-size="19" fill="#21645d" text-anchor="start">从逻辑电平回到电路</text><text x="50" y="75" font-size="19" fill="#243b47" text-anchor="start">低压 LED 示意</text><line x1="55" y1="145" x2="130" y2="145" stroke="#243b47" stroke-width="2"  /><text x="50" y="128" font-size="17" fill="#243b47" text-anchor="start">GPIO</text><rect x="130" y="130" width="90" height="30" rx="6" fill="#fff" stroke="#adc1bb"/><text x="163" y="120" font-size="18" fill="#243b47" text-anchor="start">R</text><line x1="220" y1="145" x2="300" y2="145" stroke="#243b47" stroke-width="2"  /><path d="M300 127 L300 163 L330 145 Z" fill="none" stroke="#a15430" stroke-width="2"/><line x1="333" y1="125" x2="333" y2="165" stroke="#a15430" stroke-width="2"  /><line x1="333" y1="145" x2="395" y2="145" stroke="#243b47" stroke-width="2"  /><line x1="395" y1="145" x2="395" y2="245" stroke="#243b47" stroke-width="2"  /><line x1="372" y1="245" x2="418" y2="245" stroke="#243b47" stroke-width="2"  /><line x1="380" y1="253" x2="410" y2="253" stroke="#243b47" stroke-width="2"  /><line x1="388" y1="261" x2="402" y2="261" stroke="#243b47" stroke-width="2"  /><text x="283" y="192" font-size="17" fill="#243b47" text-anchor="start">LED</text><line x1="310" y1="114" x2="330" y2="96" stroke="#a15430" stroke-width="2" marker-end="url(#arrow)" /><line x1="329" y1="117" x2="349" y2="99" stroke="#a15430" stroke-width="2" marker-end="url(#arrow)" /><text x="480" y="75" font-size="19" fill="#243b47" text-anchor="start">开漏与 RC 上升</text><text x="590" y="110" font-size="17" fill="#243b47" text-anchor="start">VDD</text><line x1="610" y1="115" x2="610" y2="140" stroke="#243b47" stroke-width="2"  /><rect x="595" y="140" width="30" height="65" rx="6" fill="#fff" stroke="#adc1bb"/><text x="635" y="178" font-size="16" fill="#243b47" text-anchor="start">R pull-up</text><line x1="610" y1="205" x2="610" y2="230" stroke="#243b47" stroke-width="2"  /><line x1="610" y1="230" x2="795" y2="230" stroke="#243b47" stroke-width="2"  /><circle cx="610" cy="230" r="4" fill="#21645d"/><text x="720" y="215" font-size="16" fill="#243b47" text-anchor="start">bus</text><line x1="780" y1="230" x2="780" y2="260" stroke="#243b47" stroke-width="2"  /><line x1="760" y1="260" x2="800" y2="260" stroke="#243b47" stroke-width="2"  /><line x1="760" y1="270" x2="800" y2="270" stroke="#243b47" stroke-width="2"  /><text x="810" y="270" font-size="17" fill="#243b47" text-anchor="start">C</text><line x1="780" y1="270" x2="780" y2="295" stroke="#243b47" stroke-width="2"  /><line x1="760" y1="295" x2="800" y2="295" stroke="#243b47" stroke-width="2"  /><line x1="610" y1="230" x2="610" y2="255" stroke="#243b47" stroke-width="2"  /><line x1="610" y1="255" x2="625" y2="280" stroke="#243b47" stroke-width="2"  /><line x1="610" y1="290" x2="610" y2="300" stroke="#243b47" stroke-width="2"  /><line x1="590" y1="300" x2="630" y2="300" stroke="#243b47" stroke-width="2"  /><text x="480" y="290" font-size="14" fill="#243b47" text-anchor="start">sink switch</text><text x="40" y="335" font-size="17" fill="#243b47" text-anchor="start">连接实物前核对电压、极性、限流和引脚额定；图不含完整保护电路。</text></g></svg>