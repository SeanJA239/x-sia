<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">从地址到数据</title><desc id="desc">TLB 未命中不等于缺页，缺页也不都需要磁盘读取。 图为职责关系；实际处理器可以重叠部分查询。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#243b47"/></marker></defs><rect width="900" height="360" fill="#fafbf9"/><g font-family="Arial, 'Microsoft YaHei', sans-serif"><text x="30" y="35" font-size="19" fill="#21645d" text-anchor="start">从地址到数据</text><rect x="35" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="125" y="131" font-size="18" fill="#243b47" text-anchor="middle">虚拟地址</text><text x="125" y="156" font-size="14" fill="#243b47" text-anchor="middle">页号 + 偏移</text><line x1="219" y1="141" x2="246" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="250" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="340" y="131" font-size="18" fill="#243b47" text-anchor="middle">转换查询</text><text x="340" y="156" font-size="14" fill="#243b47" text-anchor="middle">TLB / 页表</text><line x1="434" y1="141" x2="461" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="465" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="555" y="131" font-size="18" fill="#243b47" text-anchor="middle">物理地址</text><text x="555" y="156" font-size="14" fill="#243b47" text-anchor="middle">页框 + 原偏移</text><line x1="649" y1="141" x2="676" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="680" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="770" y="131" font-size="18" fill="#243b47" text-anchor="middle">缓存与内存</text><text x="770" y="156" font-size="14" fill="#243b47" text-anchor="middle">数据 / 指令访问</text><text x="40" y="235" font-size="17" fill="#243b47" text-anchor="start">TLB 未命中不等于缺页，缺页也不都需要磁盘读取。</text><text x="40" y="265" font-size="17" fill="#243b47" text-anchor="start">图为职责关系；实际处理器可以重叠部分查询。</text></g></svg>