<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">读—改—写的丢失更新</title><desc id="desc">两个线程先后读取零又分别写入一，最终只增加一次；互斥保护整个操作可避免这种交错。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#243b47"/></marker></defs><rect width="900" height="360" fill="#fafbf9"/><g font-family="Arial, 'Microsoft YaHei', sans-serif"><text x="30" y="35" font-size="19" fill="#21645d" text-anchor="start">读—改—写的丢失更新</text><text x="40" y="78" font-size="20" fill="#243b47" text-anchor="start">未同步</text><text x="475" y="78" font-size="20" fill="#243b47" text-anchor="start">保护整个操作</text><line x1="95" y1="100" x2="95" y2="310" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><line x1="300" y1="100" x2="300" y2="310" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><text x="65" y="100" font-size="18" fill="#243b47" text-anchor="start">A</text><text x="270" y="100" font-size="18" fill="#243b47" text-anchor="start">B</text><text x="112" y="143" font-size="19" fill="#243b47" text-anchor="start">read 0</text><text x="315" y="178" font-size="19" fill="#243b47" text-anchor="start">read 0</text><text x="112" y="218" font-size="19" fill="#243b47" text-anchor="start">write 1</text><text x="315" y="253" font-size="19" fill="#243b47" text-anchor="start">write 1</text><rect x="495" y="105" width="335" height="80" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="512" y="140" font-size="18" fill="#243b47" text-anchor="start">A: lock → 0 + 1 → unlock</text><rect x="495" y="205" width="335" height="80" rx="6" fill="#e8eef7" stroke="#adc1bb"/><text x="512" y="240" font-size="18" fill="#243b47" text-anchor="start">B: lock → 1 + 1 → unlock</text><text x="60" y="335" font-size="17" fill="#a15430" text-anchor="start">结果 1：一次更新丢失</text><text x="515" y="335" font-size="16" fill="#243b47" text-anchor="start">结果 2：访问同一不变量需同一协议</text></g></svg>