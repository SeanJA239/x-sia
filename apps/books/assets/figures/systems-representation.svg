<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">IEEE 754 binary32 正规数</title><desc id="desc">符号一位，指数八位，小数字段二十三位。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#243b47"/></marker></defs><rect width="900" height="360" fill="#fafbf9"/><g font-family="Arial, 'Microsoft YaHei', sans-serif"><text x="30" y="35" font-size="19" fill="#21645d" text-anchor="start">IEEE 754 binary32 正规数</text><rect x="50" y="100" width="65" height="85" rx="6" fill="#f4e9df" stroke="#adc1bb"/><rect x="115" y="100" width="210" height="85" rx="6" fill="#e8eef7" stroke="#adc1bb"/><rect x="325" y="100" width="525" height="85" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="82" y="140" font-size="24" fill="#243b47" text-anchor="middle">s</text><text x="220" y="140" font-size="24" fill="#243b47" text-anchor="middle">E</text><text x="585" y="140" font-size="24" fill="#243b47" text-anchor="middle">F</text><text x="82" y="170" font-size="14" fill="#243b47" text-anchor="middle">1 bit</text><text x="220" y="170" font-size="14" fill="#243b47" text-anchor="middle">8 bits</text><text x="585" y="170" font-size="14" fill="#243b47" text-anchor="middle">23 bits</text><text x="55" y="230" font-size="22" fill="#243b47" text-anchor="start">1.5 = 1.1 (base 2) × 2^0</text><text x="55" y="267" font-size="21" fill="#243b47" text-anchor="start">s = 0, E = 127, F = 2^22  →  0x3fc00000</text><text x="55" y="315" font-size="17" fill="#243b47" text-anchor="start">E = 0 或 255 时使用特殊编码规则，不能直接套正规数公式。</text></g></svg>