<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">名字绑定与可变对象</title><desc id="desc">赋值不是复制；浅拷贝的新外层容器仍可能共享内层对象。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#243b47"/></marker></defs><rect width="900" height="360" fill="#fafbf9"/><g font-family="Arial, 'Microsoft YaHei', sans-serif"><text x="30" y="35" font-size="19" fill="#21645d" text-anchor="start">名字绑定与可变对象</text><rect x="35" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="125" y="131" font-size="18" fill="#243b47" text-anchor="middle">创建列表</text><text x="125" y="156" font-size="14" fill="#243b47" text-anchor="middle">a = [1, 2]</text><line x1="219" y1="141" x2="246" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="250" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="340" y="131" font-size="18" fill="#243b47" text-anchor="middle">共享绑定</text><text x="340" y="156" font-size="14" fill="#243b47" text-anchor="middle">b = a</text><line x1="434" y1="141" x2="461" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="465" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="555" y="131" font-size="18" fill="#243b47" text-anchor="middle">修改同一对象</text><text x="555" y="156" font-size="14" fill="#243b47" text-anchor="middle">b.append(3)</text><line x1="649" y1="141" x2="676" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="680" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="770" y="131" font-size="18" fill="#243b47" text-anchor="middle">由 a 观察</text><text x="770" y="156" font-size="14" fill="#243b47" text-anchor="middle">[1, 2, 3]</text><text x="40" y="235" font-size="17" fill="#243b47" text-anchor="start">赋值不是复制；浅拷贝的新外层容器仍可能共享内层对象。</text></g></svg>