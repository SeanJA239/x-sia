<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">UART 帧：字节如何成为时序</title><desc id="desc">先起始位，再从最低位发送 0x55 的八位，最后停止位。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#243b47"/></marker></defs><rect width="900" height="360" fill="#fafbf9"/><g font-family="Arial, 'Microsoft YaHei', sans-serif"><text x="30" y="35" font-size="19" fill="#21645d" text-anchor="start">UART 帧：字节如何成为时序</text><line x1="55" y1="110" x2="55" y2="255" stroke="#dce5e1" stroke-width="2"  stroke-dasharray="3 4"/><text x="87" y="280" font-size="13" fill="#243b47" text-anchor="middle">idle</text><line x1="120" y1="110" x2="120" y2="255" stroke="#dce5e1" stroke-width="2"  stroke-dasharray="3 4"/><text x="152" y="280" font-size="13" fill="#243b47" text-anchor="middle">start</text><line x1="185" y1="110" x2="185" y2="255" stroke="#dce5e1" stroke-width="2"  stroke-dasharray="3 4"/><text x="217" y="280" font-size="13" fill="#243b47" text-anchor="middle">d0=1</text><line x1="250" y1="110" x2="250" y2="255" stroke="#dce5e1" stroke-width="2"  stroke-dasharray="3 4"/><text x="282" y="280" font-size="13" fill="#243b47" text-anchor="middle">d1=0</text><line x1="315" y1="110" x2="315" y2="255" stroke="#dce5e1" stroke-width="2"  stroke-dasharray="3 4"/><text x="347" y="280" font-size="13" fill="#243b47" text-anchor="middle">d2=1</text><line x1="380" y1="110" x2="380" y2="255" stroke="#dce5e1" stroke-width="2"  stroke-dasharray="3 4"/><text x="412" y="280" font-size="13" fill="#243b47" text-anchor="middle">d3=0</text><line x1="445" y1="110" x2="445" y2="255" stroke="#dce5e1" stroke-width="2"  stroke-dasharray="3 4"/><text x="477" y="280" font-size="13" fill="#243b47" text-anchor="middle">d4=1</text><line x1="510" y1="110" x2="510" y2="255" stroke="#dce5e1" stroke-width="2"  stroke-dasharray="3 4"/><text x="542" y="280" font-size="13" fill="#243b47" text-anchor="middle">d5=0</text><line x1="575" y1="110" x2="575" y2="255" stroke="#dce5e1" stroke-width="2"  stroke-dasharray="3 4"/><text x="607" y="280" font-size="13" fill="#243b47" text-anchor="middle">d6=1</text><line x1="640" y1="110" x2="640" y2="255" stroke="#dce5e1" stroke-width="2"  stroke-dasharray="3 4"/><text x="672" y="280" font-size="13" fill="#243b47" text-anchor="middle">d7=0</text><line x1="705" y1="110" x2="705" y2="255" stroke="#dce5e1" stroke-width="2"  stroke-dasharray="3 4"/><text x="737" y="280" font-size="13" fill="#243b47" text-anchor="middle">stop</text><line x1="770" y1="110" x2="770" y2="255" stroke="#dce5e1" stroke-width="2"  stroke-dasharray="3 4"/><text x="802" y="280" font-size="13" fill="#243b47" text-anchor="middle">idle</text><polyline points="55,135 120,135 120,135 120,225 185,225 185,225 185,135 250,135 250,135 250,225 315,225 315,225 315,135 380,135 380,135 380,225 445,225 445,225 445,135 510,135 510,135 510,225 575,225 575,225 575,135 640,135 640,135 640,225 705,225 705,225 705,135 770,135 770,135 770,135 835,135" fill="none" stroke="#21645d" stroke-width="3" /><text x="40" y="323" font-size="17" fill="#243b47" text-anchor="start">0x55，8N1，LSB first；示意位宽相等，不是实测波形。</text></g></svg>