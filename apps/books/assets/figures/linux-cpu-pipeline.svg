<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">经典五级指令流水线</title><desc id="desc">IF、ID、EX、MEM、WB 各阶段按周期错位重叠，示意理想吞吐而非真实处理器测量。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#243b47"/></marker></defs><rect width="900" height="360" fill="#fafbf9"/><g font-family="Arial, 'Microsoft YaHei', sans-serif"><text x="30" y="35" font-size="19" fill="#21645d" text-anchor="start">经典五级指令流水线</text><text x="188" y="77" font-size="15" fill="#243b47" text-anchor="middle">C1</text><text x="266" y="77" font-size="15" fill="#243b47" text-anchor="middle">C2</text><text x="344" y="77" font-size="15" fill="#243b47" text-anchor="middle">C3</text><text x="422" y="77" font-size="15" fill="#243b47" text-anchor="middle">C4</text><text x="500" y="77" font-size="15" fill="#243b47" text-anchor="middle">C5</text><text x="578" y="77" font-size="15" fill="#243b47" text-anchor="middle">C6</text><text x="656" y="77" font-size="15" fill="#243b47" text-anchor="middle">C7</text><text x="734" y="77" font-size="15" fill="#243b47" text-anchor="middle">C8</text><text x="35" y="116" font-size="17" fill="#243b47" text-anchor="start">指令 1</text><rect x="155" y="91" width="69" height="36" rx="6" fill="#e3efe8" stroke="#adc1bb"/><text x="189" y="115" font-size="15" fill="#243b47" text-anchor="middle">IF</text><rect x="233" y="91" width="69" height="36" rx="6" fill="#e3ecf7" stroke="#adc1bb"/><text x="267" y="115" font-size="15" fill="#243b47" text-anchor="middle">ID</text><rect x="311" y="91" width="69" height="36" rx="6" fill="#e3efe8" stroke="#adc1bb"/><text x="345" y="115" font-size="15" fill="#243b47" text-anchor="middle">EX</text><rect x="389" y="91" width="69" height="36" rx="6" fill="#e3ecf7" stroke="#adc1bb"/><text x="423" y="115" font-size="15" fill="#243b47" text-anchor="middle">MEM</text><rect x="467" y="91" width="69" height="36" rx="6" fill="#e3efe8" stroke="#adc1bb"/><text x="501" y="115" font-size="15" fill="#243b47" text-anchor="middle">WB</text><text x="35" y="163" font-size="17" fill="#243b47" text-anchor="start">指令 2</text><rect x="233" y="138" width="69" height="36" rx="6" fill="#e3efe8" stroke="#adc1bb"/><text x="267" y="162" font-size="15" fill="#243b47" text-anchor="middle">IF</text><rect x="311" y="138" width="69" height="36" rx="6" fill="#e3ecf7" stroke="#adc1bb"/><text x="345" y="162" font-size="15" fill="#243b47" text-anchor="middle">ID</text><rect x="389" y="138" width="69" height="36" rx="6" fill="#e3efe8" stroke="#adc1bb"/><text x="423" y="162" font-size="15" fill="#243b47" text-anchor="middle">EX</text><rect x="467" y="138" width="69" height="36" rx="6" fill="#e3ecf7" stroke="#adc1bb"/><text x="501" y="162" font-size="15" fill="#243b47" text-anchor="middle">MEM</text><rect x="545" y="138" width="69" height="36" rx="6" fill="#e3efe8" stroke="#adc1bb"/><text x="579" y="162" font-size="15" fill="#243b47" text-anchor="middle">WB</text><text x="35" y="210" font-size="17" fill="#243b47" text-anchor="start">指令 3</text><rect x="311" y="185" width="69" height="36" rx="6" fill="#e3efe8" stroke="#adc1bb"/><text x="345" y="209" font-size="15" fill="#243b47" text-anchor="middle">IF</text><rect x="389" y="185" width="69" height="36" rx="6" fill="#e3ecf7" stroke="#adc1bb"/><text x="423" y="209" font-size="15" fill="#243b47" text-anchor="middle">ID</text><rect x="467" y="185" width="69" height="36" rx="6" fill="#e3efe8" stroke="#adc1bb"/><text x="501" y="209" font-size="15" fill="#243b47" text-anchor="middle">EX</text><rect x="545" y="185" width="69" height="36" rx="6" fill="#e3ecf7" stroke="#adc1bb"/><text x="579" y="209" font-size="15" fill="#243b47" text-anchor="middle">MEM</text><rect x="623" y="185" width="69" height="36" rx="6" fill="#e3efe8" stroke="#adc1bb"/><text x="657" y="209" font-size="15" fill="#243b47" text-anchor="middle">WB</text><text x="35" y="257" font-size="17" fill="#243b47" text-anchor="start">指令 4</text><rect x="389" y="232" width="69" height="36" rx="6" fill="#e3efe8" stroke="#adc1bb"/><text x="423" y="256" font-size="15" fill="#243b47" text-anchor="middle">IF</text><rect x="467" y="232" width="69" height="36" rx="6" fill="#e3ecf7" stroke="#adc1bb"/><text x="501" y="256" font-size="15" fill="#243b47" text-anchor="middle">ID</text><rect x="545" y="232" width="69" height="36" rx="6" fill="#e3efe8" stroke="#adc1bb"/><text x="579" y="256" font-size="15" fill="#243b47" text-anchor="middle">EX</text><rect x="623" y="232" width="69" height="36" rx="6" fill="#e3ecf7" stroke="#adc1bb"/><text x="657" y="256" font-size="15" fill="#243b47" text-anchor="middle">MEM</text><rect x="701" y="232" width="69" height="36" rx="6" fill="#e3efe8" stroke="#adc1bb"/><text x="735" y="256" font-size="15" fill="#243b47" text-anchor="middle">WB</text><text x="35" y="314" font-size="17" fill="#243b47" text-anchor="start">无停顿的四条指令共用八周期；首条延迟仍为五周期。</text><text x="35" y="343" font-size="16" fill="#243b47" text-anchor="start">教学模型；真实结构、访存时序、分支和数据冒险会改变时间表。</text></g></svg>