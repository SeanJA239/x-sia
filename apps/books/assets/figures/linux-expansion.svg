<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">普通参数位置：引用决定边界</title><desc id="desc">同一个变量在未引用的普通参数位置可能分词并展开路径名；双引号通常保留一个参数。数组保留每个元素边界。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#243b47"/></marker></defs><rect width="900" height="360" fill="#fafbf9"/><g font-family="Arial, 'Microsoft YaHei', sans-serif"><text x="30" y="35" font-size="19" fill="#21645d" text-anchor="start">普通参数位置：引用决定边界</text><rect x="30" y="82" width="215" height="75" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="137.5" y="113" font-size="18" fill="#243b47" text-anchor="middle">name 的内容</text><text x="137.5" y="138" font-size="14" fill="#243b47" text-anchor="middle">annual report.txt</text><rect x="340" y="65" width="225" height="75" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="452.5" y="96" font-size="18" fill="#243b47" text-anchor="middle">$name（未引用）</text><text x="452.5" y="121" font-size="14" fill="#243b47" text-anchor="middle">按默认 IFS 分词</text><rect x="655" y="65" width="215" height="75" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="762.5" y="96" font-size="18" fill="#243b47" text-anchor="middle">两个参数</text><text x="762.5" y="121" font-size="14" fill="#243b47" text-anchor="middle">annual / report.txt</text><rect x="340" y="195" width="225" height="75" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="452.5" y="226" font-size="18" fill="#243b47" text-anchor="middle">&quot;$name&quot;（双引号）</text><text x="452.5" y="251" font-size="14" fill="#243b47" text-anchor="middle">保留变量结果边界</text><rect x="655" y="195" width="215" height="75" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="762.5" y="226" font-size="18" fill="#243b47" text-anchor="middle">一个参数</text><text x="762.5" y="251" font-size="14" fill="#243b47" text-anchor="middle">annual report.txt</text><line x1="247" y1="115" x2="337" y2="105" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><line x1="567" y1="105" x2="652" y2="105" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><line x1="247" y1="137" x2="337" y2="230" stroke="#21645d" stroke-width="2" marker-end="url(#arrow)" /><line x1="567" y1="232" x2="652" y2="232" stroke="#21645d" stroke-width="2" marker-end="url(#arrow)" /><text x="35" y="310" font-size="17" fill="#243b47" text-anchor="start">若内容还有 * 等字符，未引用结果还可能发生路径名展开。</text><text x="35" y="339" font-size="16" fill="#243b47" text-anchor="start">赋值、条件与算术等上下文规则不同；本图不是完整的 Bash 解析流程。</text></g></svg>