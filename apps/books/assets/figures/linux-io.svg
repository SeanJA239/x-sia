<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">I/O 的跨层状态</title><desc id="desc">提交、完成和所需持久性不是同一事件。 不同对象与 I/O 模式有不同路径；不是所有操作都经过每一层。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#243b47"/></marker></defs><rect width="900" height="360" fill="#fafbf9"/><g font-family="Arial, 'Microsoft YaHei', sans-serif"><text x="30" y="35" font-size="19" fill="#21645d" text-anchor="start">I/O 的跨层状态</text><rect x="35" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="125" y="131" font-size="18" fill="#243b47" text-anchor="middle">应用缓冲</text><text x="125" y="156" font-size="14" fill="#243b47" text-anchor="middle">高层写入 / flush</text><line x1="219" y1="141" x2="246" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="250" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="340" y="131" font-size="18" fill="#243b47" text-anchor="middle">内核与缓存</text><text x="340" y="156" font-size="14" fill="#243b47" text-anchor="middle">检查 / 暂存 / 写回</text><line x1="434" y1="141" x2="461" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="465" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="555" y="131" font-size="18" fill="#243b47" text-anchor="middle">设备队列</text><text x="555" y="156" font-size="14" fill="#243b47" text-anchor="middle">DMA / 执行</text><line x1="649" y1="141" x2="676" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="680" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="770" y="131" font-size="18" fill="#243b47" text-anchor="middle">完成与恢复</text><text x="770" y="156" font-size="14" fill="#243b47" text-anchor="middle">逐项检查语义</text><text x="40" y="235" font-size="17" fill="#243b47" text-anchor="start">提交、完成和所需持久性不是同一事件。</text><text x="40" y="265" font-size="17" fill="#243b47" text-anchor="start">不同对象与 I/O 模式有不同路径；不是所有操作都经过每一层。</text></g></svg>