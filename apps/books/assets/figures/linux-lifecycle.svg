<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">fork、exec 与退出回收</title><desc id="desc">父进程创建子进程后仍有自己的执行路径；子进程用 exec 替换映像，退出后保留状态供父进程 wait 回收。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#243b47"/></marker></defs><rect width="900" height="360" fill="#fafbf9"/><g font-family="Arial, 'Microsoft YaHei', sans-serif"><text x="30" y="35" font-size="19" fill="#21645d" text-anchor="start">fork、exec 与退出回收</text><rect x="35" y="65" width="190" height="70" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="130" y="96" font-size="18" fill="#243b47" text-anchor="middle">父进程</text><text x="130" y="121" font-size="14" fill="#243b47" text-anchor="middle">创建前的执行上下文</text><rect x="650" y="65" width="215" height="70" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="757.5" y="96" font-size="18" fill="#243b47" text-anchor="middle">父进程继续 / wait</text><text x="757.5" y="121" font-size="14" fill="#243b47" text-anchor="middle">等待方式由程序决定</text><line x1="227" y1="100" x2="647" y2="100" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><text x="380" y="85" font-size="16" fill="#243b47" text-anchor="start">父进程路径</text><line x1="125" y1="137" x2="125" y2="205" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><text x="143" y="180" font-size="16" fill="#a15430" text-anchor="start">fork</text><rect x="35" y="210" width="190" height="75" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="130" y="241" font-size="18" fill="#243b47" text-anchor="middle">子进程</text><text x="130" y="266" font-size="14" fill="#243b47" text-anchor="middle">独立身份 / 继承资源</text><rect x="340" y="210" width="200" height="75" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="440" y="241" font-size="18" fill="#243b47" text-anchor="middle">exec 新映像</text><text x="440" y="266" font-size="14" fill="#243b47" text-anchor="middle">PID 不因 exec 改变</text><rect x="650" y="210" width="215" height="75" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="757.5" y="241" font-size="18" fill="#243b47" text-anchor="middle">退出记录</text><text x="757.5" y="266" font-size="14" fill="#243b47" text-anchor="middle">已退出，等待回收</text><line x1="228" y1="247" x2="337" y2="247" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><line x1="543" y1="247" x2="647" y2="247" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><text x="570" y="232" font-size="15" fill="#243b47" text-anchor="start">exit</text><line x1="758" y1="208" x2="758" y2="138" stroke="#a15430" stroke-width="2" marker-end="url(#arrow)" /><text x="773" y="179" font-size="15" fill="#a15430" text-anchor="start">回收</text><text x="35" y="329" font-size="16" fill="#243b47" text-anchor="start">语义示意；Shell 可以采用其他创建接口或优化，并非每条命令都经历全部步骤。</text></g></svg>