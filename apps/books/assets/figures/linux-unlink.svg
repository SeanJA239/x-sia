<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">名字消失与对象回收是两件事</title><desc id="desc">中间阶段：du 可能找不到文件，但已打开的描述符仍可访问内容。 回收不等于安全擦除；快照、备份与文件系统策略还会影响空间和数据保留。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#243b47"/></marker></defs><rect width="900" height="360" fill="#fafbf9"/><g font-family="Arial, 'Microsoft YaHei', sans-serif"><text x="30" y="35" font-size="19" fill="#21645d" text-anchor="start">名字消失与对象回收是两件事</text><rect x="35" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="125" y="131" font-size="18" fill="#243b47" text-anchor="middle">文件仍有名字</text><text x="125" y="156" font-size="14" fill="#243b47" text-anchor="middle">目录项 + 打开引用</text><line x1="219" y1="141" x2="246" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="250" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="340" y="131" font-size="18" fill="#243b47" text-anchor="middle">最后名字 unlink</text><text x="340" y="156" font-size="14" fill="#243b47" text-anchor="middle">链接计数变为 0</text><line x1="434" y1="141" x2="461" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="465" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="555" y="131" font-size="18" fill="#243b47" text-anchor="middle">读者继续使用</text><text x="555" y="156" font-size="14" fill="#243b47" text-anchor="middle">打开引用仍存在</text><line x1="649" y1="141" x2="676" y2="141" stroke="#243b47" stroke-width="2" marker-end="url(#arrow)" /><rect x="680" y="100" width="180" height="83" rx="6" fill="#edf4f1" stroke="#adc1bb"/><text x="770" y="131" font-size="18" fill="#243b47" text-anchor="middle">最后引用关闭</text><text x="770" y="156" font-size="14" fill="#243b47" text-anchor="middle">对象可进入回收</text><text x="40" y="235" font-size="17" fill="#243b47" text-anchor="start">中间阶段：du 可能找不到文件，但已打开的描述符仍可访问内容。</text><text x="40" y="265" font-size="17" fill="#243b47" text-anchor="start">回收不等于安全擦除；快照、备份与文件系统策略还会影响空间和数据保留。</text></g></svg>